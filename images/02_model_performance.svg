<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760">
  <rect width="1200" height="760" fill="white"/>
  <style>
    .title{font:700 32px Arial,sans-serif;fill:#111827}.axis{font:400 17px Arial,sans-serif;fill:#4B5563}.label{font:600 18px Arial,sans-serif;fill:#111827}.note{font:400 17px Arial,sans-serif;fill:#374151}.bar{fill:#D1D5DB;stroke:#6B7280;stroke-width:1.5}.grid{stroke:#E5E7EB;stroke-width:1}.strong{font:700 20px Arial,sans-serif;fill:#111827}
  </style>
  <text x="600" y="55" text-anchor="middle" class="title">Model Performance Across Evaluation Scenarios</text>
  <line x1="130" y1="590" x2="1080" y2="590" stroke="#6B7280" stroke-width="2"/>
  <line x1="130" y1="140" x2="130" y2="590" stroke="#6B7280" stroke-width="2"/>
  <g class="grid"><line x1="130" y1="500" x2="1080" y2="500"/><line x1="130" y1="410" x2="1080" y2="410"/><line x1="130" y1="320" x2="1080" y2="320"/><line x1="130" y1="230" x2="1080" y2="230"/><line x1="130" y1="140" x2="1080" y2="140"/></g>
  <g class="axis"><text x="105" y="595" text-anchor="end">0</text><text x="105" y="505" text-anchor="end">20</text><text x="105" y="415" text-anchor="end">40</text><text x="105" y="325" text-anchor="end">60</text><text x="105" y="235" text-anchor="end">80</text><text x="105" y="145" text-anchor="end">100</text><text x="55" y="365" transform="rotate(-90 55 365)" text-anchor="middle">Accuracy (%)</text></g>
  <rect x="230" y="266" width="180" height="324" class="bar"/><rect x="510" y="226" width="180" height="364" class="bar"/><rect x="790" y="199" width="180" height="391" class="bar"/>
  <text x="320" y="250" text-anchor="middle" class="strong">72%</text><text x="600" y="210" text-anchor="middle" class="strong">81%</text><text x="880" y="183" text-anchor="middle" class="strong">87%</text>
  <text x="320" y="628" text-anchor="middle" class="label"><tspan x="320">SVM</tspan><tspan x="320" dy="24">Random split</tspan></text><text x="600" y="628" text-anchor="middle" class="label"><tspan x="600">DistilBERT</tspan><tspan x="600" dy="24">Random split</tspan></text><text x="880" y="628" text-anchor="middle" class="label"><tspan x="880">DistilBERT</tspan><tspan x="880" dy="24">Temporal split</tspan></text>
  <text x="130" y="705" class="note">F1 scores: Random DistilBERT  Positive 0.92 | Negative 0.63 | Neutral 0.63</text>
  <text x="130" y="732" class="note">Temporal DistilBERT  Positive 0.93 | Negative 0.84 | Neutral 0.55</text>
</svg>